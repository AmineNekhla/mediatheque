security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_user_provider:
            entity:
                class: App\Entity\Utilisateur
                property: email

    # Un administrateur peut tout ce que fait un bibliothécaire.
    # Le bibliothécaire n'hérite PAS de ROLE_ADHERENT : le personnel n'a pas de carte.
    role_hierarchy:
        ROLE_ADMIN: [ROLE_BIBLIOTHECAIRE]

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|css|images|js)/
            security: false
        main:
            lazy: true
            provider: app_user_provider
            form_login:
                login_path: app_login
                check_path: app_login
                enable_csrf: true
                default_target_path: app_accueil
            logout:
                path: app_logout
                target: app_accueil

    access_control:
        - { path: ^/admin, roles: ROLE_BIBLIOTHECAIRE }
        - { path: ^/biblio, roles: ROLE_BIBLIOTHECAIRE }
        - { path: ^/mon-espace, roles: ROLE_ADHERENT }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10