services:
  database:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-mediatheque}
      MYSQL_USER: ${MYSQL_USER:-app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-app}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    volumes:
      - database_data:/var/lib/mysql

  app:
    build: .
    depends_on:
      database:
        condition: service_healthy
    environment:
      # Environnement de démonstration : ces valeurs ne doivent jamais servir en production.
      APP_ENV: dev
      APP_SECRET: ${APP_SECRET:-secret-de-demonstration-a-remplacer}
      DATABASE_URL: mysql://${MYSQL_USER:-app}:${MYSQL_PASSWORD:-app}@database:3306/${MYSQL_DATABASE:-mediatheque}?serverVersion=8.0&charset=utf8mb4
      LOAD_DEMO_DATA: ${LOAD_DEMO_DATA:-1}
      APP_PORT: ${APP_PORT:-8000}
    ports:
      - "${APP_PORT:-8000}:80"

volumes:
  database_data:
